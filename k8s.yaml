# The organization's 3D studio, simple version: one pod, an in-memory queue, one render at a time.
#   kubectl -n studio3d create secret generic studio --from-literal=token=<token>   (see README.md)
#   kubectl apply -f k8s.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: studio3d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio
  namespace: studio3d
spec:
  replicas: 1                      # a single queue, one render at a time (several workers: next module)
  selector:
    matchLabels: { app: studio }
  template:
    metadata:
      labels: { app: studio }
    spec:
      containers:
        - name: studio
          image: studio3d:1
          imagePullPolicy: IfNotPresent   # image imported by "k3d image import", no registry
          ports: [{ containerPort: 8000 }]
          env:
            - name: STUDIO_TOKEN
              valueFrom: { secretKeyRef: { name: studio, key: token } }
            - name: STUDIO_PUBLIC_URL
              value: http://studio.localhost:8080
            - name: MAX_DURATION
              value: "300"
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "8", memory: 6Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          volumeMounts: [{ name: renders, mountPath: /data/renders }]
      volumes:
        - name: renders
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: studio
  namespace: studio3d
spec:
  selector: { app: studio }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Only the rendered files (signed links /r/…) are published outside the cluster; the MCP
# endpoint (/mcp) stays internal, reached by Open WebUI through the service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studio
  namespace: studio3d
spec:
  ingressClassName: traefik
  rules:
    - host: studio.localhost
      http:
        paths:
          - path: /r/
            pathType: Prefix
            backend: { service: { name: studio, port: { number: 8000 } } }
---
# Isolation: the code written by the model runs in this pod, which has no outbound access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-no-egress
  namespace: studio3d
spec:
  podSelector: { matchLabels: { app: studio } }
  policyTypes: [Egress]
  egress: []
